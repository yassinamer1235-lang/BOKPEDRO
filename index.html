<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0d1117"
    >

    <title>BOK PED - فتح حساب</title>


    <!-- الخط -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            width: 100%;
            min-height: 100%;
        }


        body {

            width: 100%;
            min-height: 100vh;

            font-family: "Cairo", sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(176, 0, 32, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(0, 122, 255, 0.10),
                    transparent 35%
                ),
                #0d1117;

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            overflow-x: hidden;
        }


        /* الخلفية */

        .background-circle {

            position: fixed;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            filter: blur(70px);

            opacity: 0.25;

            pointer-events: none;

            z-index: 0;
        }


        .circle-one {

            top: -120px;
            right: -100px;

            background: #b00020;
        }


        .circle-two {

            bottom: -140px;
            left: -100px;

            background: #007aff;
        }


        /* الحاوية */

        .container {

            width: 100%;
            max-width: 430px;

            position: relative;
            z-index: 2;
        }


        /* البطاقة */

        .card {

            width: 100%;

            padding: 32px 24px 26px;

            border-radius: 28px;

            background:
                rgba(255, 255, 255, 0.075);

            border:
                1px solid rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);

            animation:
                cardAppear 0.7s ease;
        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* الشعار */

        .logo {

            width: 78px;
            height: 78px;

            margin: 0 auto 18px;

            border-radius: 24px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #b00020,
                    #780018
                );

            box-shadow:
                0 12px 35px rgba(176, 0, 32, 0.35);

            font-size: 25px;
            font-weight: 800;

            letter-spacing: -1px;

            user-select: none;
        }


        /* العنوان */

        .title {

            text-align: center;

            font-size: 27px;

            font-weight: 800;

            margin-bottom: 5px;
        }


        .subtitle {

            text-align: center;

            color: rgba(255,255,255,0.62);

            font-size: 14px;

            margin-bottom: 30px;
        }


        /* الحقول */

        .input-group {

            margin-bottom: 17px;
        }


        .input-label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 600;

            color:
                rgba(255,255,255,0.82);
        }


        .input-wrapper {

            position: relative;
        }


        .input-icon {

            position: absolute;

            right: 16px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 18px;

            opacity: 0.7;

            pointer-events: none;
        }


        input,
        select {

            width: 100%;

            height: 58px;

            border: none;

            outline: none;

            border-radius: 17px;

            padding:
                0 50px 0 16px;

            background:
                rgba(0,0,0,0.22);

            border:
                1px solid
                rgba(255,255,255,0.10);

            color: #ffffff;

            font-family:
                "Cairo", sans-serif;

            font-size: 15px;

            transition:
                0.25s ease;
        }


        input::placeholder {

            color:
                rgba(255,255,255,0.35);
        }


        input:focus,
        select:focus {

            border-color:
                rgba(0,122,255,0.75);

            background:
                rgba(0,0,0,0.30);

            box-shadow:
                0 0 0 4px
                rgba(0,122,255,0.10);
        }


        /* اختيار الاشتراك */

        .subscription-wrapper {

            position: relative;
        }


        .subscription-wrapper .input-icon {

            z-index: 2;
        }


        select {

            appearance: none;
            -webkit-appearance: none;

            cursor: pointer;

            padding-right: 50px;
        }


        select option {

            background: #161b22;

            color: #ffffff;
        }


        .select-arrow {

            position: absolute;

            left: 17px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 13px;

            color:
                rgba(255,255,255,0.55);

            pointer-events: none;
        }


        /* معلومات الاشتراك */

        .subscription-info {

            margin-top: -5px;

            margin-bottom: 18px;

            padding: 13px 15px;

            border-radius: 15px;

            background:
                rgba(0,122,255,0.07);

            border:
                1px solid
                rgba(0,122,255,0.15);

            color:
                rgba(255,255,255,0.62);

            font-size: 12px;

            line-height: 1.8;

            text-align: center;

            transition:
                0.25s ease;
        }


        .subscription-info strong {

            color: #ffffff;
        }


        /* زر فتح الحساب */

        #createAccount {

            width: 100%;

            height: 58px;

            border: none;

            outline: none;

            border-radius: 17px;

            margin-top: 8px;

            background:
                linear-gradient(
                    135deg,
                    #007aff,
                    #0066d6
                );

            color: #ffffff;

            font-family:
                "Cairo", sans-serif;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 12px 30px
                rgba(0,122,255,0.25);

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                opacity 0.18s ease;
        }


        #createAccount:hover {

            box-shadow:
                0 15px 35px
                rgba(0,122,255,0.35);

            transform:
                translateY(-1px);
        }


        #createAccount:active {

            transform:
                scale(0.98);
        }


        #createAccount:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;
        }


        /* الرسائل */

        #message {

            margin-top: 20px;

            text-align: center;

            font-size: 14px;

            line-height: 1.8;
        }


        #message.error {

            padding: 13px 15px;

            border-radius: 15px;

            background:
                rgba(255, 59, 48, 0.10);

            border:
                1px solid
                rgba(255, 59, 48, 0.25);

            color: #ff6b63;

            animation:
                messageAppear 0.3s ease;
        }


        #message.loading {

            color:
                rgba(255,255,255,0.65);

            animation:
                pulse 1.2s infinite;
        }


        #message.success {

            padding: 18px;

            border-radius: 20px;

            background:
                rgba(52,199,89,0.09);

            border:
                1px solid
                rgba(52,199,89,0.22);

            color: #ffffff;

            animation:
                messageAppear 0.4s ease;
        }


        @keyframes messageAppear {

            from {

                opacity: 0;

                transform:
                    translateY(8px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes pulse {

            0%, 100% {
                opacity: 0.55;
            }

            50% {
                opacity: 1;
            }
        }


        /* نجاح الحساب */

        .success-title {

            font-size: 18px;

            font-weight: 800;

            color: #34c759;

            margin-bottom: 16px;
        }


        .account-box {

            padding: 17px;

            border-radius: 16px;

            background:
                rgba(0,0,0,0.22);

            border:
                1px solid
                rgba(255,255,255,0.08);
        }


        .account-label {

            color:
                rgba(255,255,255,0.48);

            font-size: 12px;

            margin-top: 8px;

            margin-bottom: 2px;
        }


        .account-label:first-child {

            margin-top: 0;
        }


        .account-number {

            font-size: 25px;

            font-weight: 800;

            letter-spacing: 2px;

            direction: ltr;

            margin-top: 3px;

            color: #ffffff;
        }


        .subscription-end {

            margin-top: 8px;

            font-size: 14px;

            color: #34c759;

            font-weight: 700;
        }


        .success-text {

            margin-top: 14px;

            color:
                rgba(255,255,255,0.55);

            font-size: 12px;
        }


        /* أسفل البطاقة */

        .footer {

            text-align: center;

            margin-top: 18px;

            color:
                rgba(255,255,255,0.35);

            font-size: 11px;
        }


        /* الهاتف */

        @media (max-width: 420px) {

            body {
                padding: 14px;
            }

            .card {
                padding:
                    28px 19px 23px;

                border-radius: 24px;
            }

            .logo {
                width: 70px;
                height: 70px;
                border-radius: 21px;
                font-size: 22px;
            }

            .title {
                font-size: 24px;
            }

            input,
            select,
            #createAccount {
                height: 55px;
            }
        }

    </style>

</head>


<body>


    <!-- الخلفية -->

    <div class="background-circle circle-one"></div>

    <div class="background-circle circle-two"></div>


    <!-- المحتوى -->

    <main class="container">

        <section class="card">


            <!-- الشعار -->

            <div class="logo">
                BOK
            </div>


            <!-- العنوان -->

            <h1 class="title">
                فتح حساب
            </h1>


            <p class="subtitle">
                أنشئ حسابك في BOK PED بسهولة
            </p>


            <!-- اسم المستخدم -->

            <div class="input-group">

                <label
                    class="input-label"
                    for="username"
                >
                    اسم المستخدم
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        id="username"
                        type="text"
                        placeholder="أدخل اسم المستخدم"
                        autocomplete="username"
                        maxlength="40"
                    >

                </div>

            </div>


            <!-- كلمة المرور -->

            <div class="input-group">

                <label
                    class="input-label"
                    for="password"
                >
                    كلمة المرور
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        id="password"
                        type="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="new-password"
                        minlength="6"
                    >

                </div>

            </div>


            <!-- مدة الاشتراك -->

            <div class="input-group">

                <label
                    class="input-label"
                    for="subscription"
                >
                    مدة الاشتراك
                </label>

                <div class="subscription-wrapper">

                    <span class="input-icon">
                        🕐
                    </span>

                    <select id="subscription">

                        <option value="day">
                            يوم واحد
                        </option>

                        <option value="week">
                            أسبوع واحد
                        </option>

                        <option value="month">
                            شهر واحد
                        </option>

                        <option value="3months">
                            3 شهور
                        </option>

                        <option value="12months">
                            12 شهر
                        </option>

                    </select>

                    <span class="select-arrow">
                        ▼
                    </span>

                </div>

            </div>


            <!-- معلومات الاشتراك -->

            <div
                id="subscriptionInfo"
                class="subscription-info"
            >
                مدة الاشتراك: <strong>يوم واحد</strong>
            </div>


            <!-- زر إنشاء الحساب -->

            <button
                id="createAccount"
                type="button"
            >
                فتح الحساب
            </button>


            <!-- الرسائل -->

            <div
                id="message"
                aria-live="polite"
            ></div>


        </section>


        <div class="footer">
            BOK PED • Secure Account
        </div>

    </main>


    <!-- JavaScript -->

    <script
        type="module"
        src="./app.js"
    ></script>


</body>

  </html>
